name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "read-aloud-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item "rust/target/${{ matrix.target }}/release/read-aloud.exe" "$dest/"
          Copy-Item "rust/README.md","rust/README-ja.md","LICENSE" "$dest/"
          Compress-Archive -Path "$dest/*" -DestinationPath "$dest.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          dest="read-aloud-${{ matrix.name }}"
          mkdir "$dest"
          cp "rust/target/${{ matrix.target }}/release/read-aloud" "$dest/"
          cp rust/README.md rust/README-ja.md LICENSE "$dest/"
          tar czf "$dest.tar.gz" "$dest"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: read-aloud-${{ matrix.name }}
          path: |
            read-aloud-${{ matrix.name }}.zip
            read-aloud-${{ matrix.name }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
